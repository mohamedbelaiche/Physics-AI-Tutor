<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المدرس الشخصي للفيزياء</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>المدرس الشخصي للفيزياء</h1>
    <p>ملخصات الوحدات الدراسية</p>
  </header>

  <main>
    <section id="home-view" class="view">
      <h2 class="section-title">اختر الوحدة</h2>
      <div id="units-container" class="cards-grid">
        <p id="loading">جاري التحميل...</p>
      </div>
    </section>

    <section id="reader-view" class="view hidden">
      <button id="back-btn" class="back-btn">→ العودة إلى الوحدات</button>
      <h2 id="reader-title" class="reader-title"></h2>
      <div id="pdf-viewer" class="pdf-viewer">
        <div id="pdf-container" class="pdf-container">
          <div id="pdf-canvas-wrap">
            <canvas id="pdf-canvas"></canvas>
            <div id="pdf-progress" class="pdf-progress hidden">جاري تحميل الملف...</div>
          </div>
          <p id="pdf-error" class="pdf-error hidden"></p>
        </div>
        <div id="pdf-controls" class="pdf-controls hidden">
          <button id="pdf-prev" class="pdf-nav">السابق</button>
          <span id="pdf-page-info" class="pdf-page-info">1 / 1</span>
          <button id="pdf-next" class="pdf-nav">التالي</button>
          <button id="pdf-fullscreen" class="pdf-icon-btn" aria-label="عرض بملء الشاشة" title="عرض بملء الشاشة">
            <svg id="pdf-fs-enter" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
              <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
              <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
              <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
            </svg>
          </button>
          <a id="pdf-download" class="pdf-download-link hidden" download>تحميل الملف</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>تطبيق عرض ملخصات الفيزياء</p>
  </footer>

  <button id="chat-btn" class="chat-btn" aria-label="اسأل المدرس الذكي">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <span>اسأل المدرس</span>
  </button>

  <div id="chat-panel" class="chat-panel hidden">
    <div class="chat-header">
      <strong>المدرس الذكي</strong>
      <div class="chat-header-actions">
        <button id="chat-fullscreen" class="chat-close" aria-label="عرض بملء الشاشة" title="عرض بملء الشاشة">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
            <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
            <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
          </svg>
        </button>
        <button id="chat-close" class="chat-close" aria-label="إغلاق">×</button>
      </div>
    </div>
    <div id="chat-messages" class="chat-messages">
      <div class="chat-msg bot">
        <p>مرحباً! أنا المدرس الذكي. اسألني عن أي سؤال في الفيزياء أو الكيمياء.</p>
      </div>
    </div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="اكتب سؤالك هنا..." autocomplete="off">
      <button type="submit" class="chat-send">إرسال</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
