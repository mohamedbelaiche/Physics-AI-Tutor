<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <title>النشاط A(t) يتناقص مثل N(t) تمامًا</title>
  <desc>منحنيان متطابقان في الشكل: عدد الأنوية N(t) = N₀·e^(−λt) بالن الأزرق، والنشاط الإشعاعي A(t) = A₀·e^(−λt) بالأخضر. لهما نفس ثابت التفكك λ ونفس زمن عمر النصف t₁/₂ ونفس ثابت الزمن τ، لأن العلاقة A = λN.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      svg * { animation: none !important; transition: none !important; }
    }
  </style>

  <!-- لوحة المشهد -->
  <rect id="panel" x="6" y="6" width="628" height="348" rx="16" fill="#f4f8fc" stroke="#d5e4f2" stroke-width="2"/>

  <!-- مستوى N₀/2 على السلّم الأيسر، ومستوى A₀/2 على السلّم الأيمن -->
  <line id="gridHalfN" x1="100" y1="208" x2="580" y2="208" stroke="#2a6db5" stroke-width="1.2" stroke-dasharray="7 6" stroke-linecap="round">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.857;1" dur="2.8s" fill="freeze"/>
  </line>
  <line id="gridHalfA" x1="100" y1="240" x2="580" y2="240" stroke="#3f9d6e" stroke-width="1.2" stroke-dasharray="7 6" stroke-linecap="round">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.862;1" dur="2.9s" fill="freeze"/>
  </line>

  <!-- محور الزمن t ومحور الكميات (أساس يُقاس منه N و A) -->
  <line id="axisX" x1="100" y1="296" x2="580" y2="296" stroke="#16213e" stroke-width="2.5" stroke-linecap="round"/>
  <line id="axisY" x1="100" y1="296" x2="100" y2="112" stroke="#16213e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- خطان رأسيان: عند t = t₁/₂ (أحمر) وعند t = τ -->
  <line id="guideHalf" x1="266.4" y1="296" x2="266.4" y2="200" stroke="#e63946" stroke-width="1.2" stroke-dasharray="6 5" stroke-linecap="round">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.871;1" dur="3.1s" fill="freeze"/>
  </line>
  <line id="guideTau" x1="340" y1="296" x2="340" y2="224" stroke="#16213e" stroke-width="1.2" stroke-dasharray="6 5" stroke-linecap="round">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.875;1" dur="3.2s" fill="freeze"/>
  </line>

  <!-- المنحنيان: نفس الشكل الأسّي e^(−λt) برسم متزامن، وسلّمان رأسيان مختلفان -->
  <path id="curveN" d="M100 120 L136 144.5 L172 165.6 L208 183.8 L244 199.4 L266.4 208 L292 216.9 L316 224.4 L340 231.3 L376 240.3 L412 248 L448 254.7 L484 260.5 L520 265.4 L556 269.7 L580 272.2" pathLength="510" fill="none" stroke="#2a6db5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="510" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="510;510;0" keyTimes="0;0.083;1" dur="2.4s" fill="freeze"/>
  </path>
  <path id="curveA" d="M100 184 L136 199.6 L172 213 L208 224.6 L244 234.5 L266.4 240 L292 245.7 L316 250.5 L340 254.8 L376 260.5 L412 265.5 L448 269.7 L484 273.4 L520 276.5 L556 279.2 L580 280.8" pathLength="492" fill="none" stroke="#3f9d6e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="492" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="492;492;0" keyTimes="0;0.083;1" dur="2.4s" fill="freeze"/>
  </path>

  <!-- نقاط التقاطع: t₁/₂ على المنحنيين ثم τ -->
  <circle id="markerHalf" cx="266.4" cy="208" r="6" fill="#2a6db5">
    <animate attributeName="r" values="0;0;6" keyTimes="0;0.879;1" dur="3.3s" fill="freeze"/>
  </circle>
  <circle id="markerHalfA" cx="266.4" cy="240" r="6" fill="#3f9d6e">
    <animate attributeName="r" values="0;0;6" keyTimes="0;0.879;1" dur="3.3s" fill="freeze"/>
  </circle>
  <circle id="markerTau" cx="340" cy="231.3" r="6" fill="#2a6db5">
    <animate attributeName="r" values="0;0;6" keyTimes="0;0.889;1" dur="3.6s" fill="freeze"/>
  </circle>
  <circle id="markerTauA" cx="340" cy="254.8" r="6" fill="#3f9d6e">
    <animate attributeName="r" values="0;0;6" keyTimes="0;0.889;1" dur="3.6s" fill="freeze"/>
  </circle>

  <!-- شريط النسبة الثابتة: عمودان لـ N و A عند t = 0، ثم عمودان عند t = t₁/₂ -->
  <line id="insetAxis" x1="440" y1="112" x2="614" y2="112" stroke="#d5e4f2" stroke-width="2" stroke-linecap="round"/>
  <rect id="barN0" x="452" y="71.3" width="16" height="38.7" fill="#2a6db5">
    <animate attributeName="height" values="0;0;38.7" keyTimes="0;0.872;1" dur="3.9s" fill="freeze"/>
    <animate attributeName="y" values="112;112;71.3" keyTimes="0;0.872;1" dur="3.9s" fill="freeze"/>
  </rect>
  <rect id="barA0" x="472" y="85.4" width="16" height="24.6" fill="#3f9d6e">
    <animate attributeName="height" values="0;0;24.6" keyTimes="0;0.872;1" dur="3.9s" fill="freeze"/>
    <animate attributeName="y" values="112;112;85.4" keyTimes="0;0.872;1" dur="3.9s" fill="freeze"/>
  </rect>
  <rect id="barNh" x="534" y="90.6" width="16" height="19.4" fill="#2a6db5">
    <animate attributeName="height" values="0;0;19.4" keyTimes="0;0.881;1" dur="4.2s" fill="freeze"/>
    <animate attributeName="y" values="112;112;90.6" keyTimes="0;0.881;1" dur="4.2s" fill="freeze"/>
  </rect>
  <rect id="barAh" x="554" y="97.7" width="16" height="12.3" fill="#3f9d6e">
    <animate attributeName="height" values="0;0;12.3" keyTimes="0;0.881;1" dur="4.2s" fill="freeze"/>
    <animate attributeName="y" values="112;112;97.7" keyTimes="0;0.881;1" dur="4.2s" fill="freeze"/>
  </rect>

  <!-- شارة تذكّر بالعلاقة A = λN -->
  <rect id="badgeRatio" x="456" y="122" width="150" height="24" rx="12" fill="#ffffff" stroke="#e63946" stroke-width="2">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.91;1" dur="4.45s" fill="freeze"/>
  </rect>

  <!-- التسميات -->
  <text id="lblTitle" x="250" y="40" text-anchor="middle" direction="rtl" font-size="20" font-weight="bold" fill="#16213e">النشاط A(t) يتناقص مثل N(t) تمامًا</text>
  <text id="lblN0" x="74" y="124" text-anchor="middle" font-size="15" fill="#2a6db5">N₀</text>
  <text id="lblNh" x="72" y="212" text-anchor="middle" font-size="15" fill="#2a6db5">N₀/2</text>
  <text id="lblA0" x="598" y="188" text-anchor="middle" font-size="15" fill="#3f9d6e">A₀</text>
  <text id="lblAh" x="594" y="244" text-anchor="middle" font-size="15" fill="#3f9d6e">A₀/2</text>
  <text id="lblCurveN" x="232" y="186" font-size="14" fill="#2a6db5">N(t)</text>
  <text id="lblCurveA" x="228" y="224" font-size="14" fill="#3f9d6e">A(t)</text>
  <text id="lblZero" x="100" y="314" text-anchor="middle" font-size="14" fill="#16213e">0</text>
  <text id="lblT" x="592" y="316" text-anchor="middle" font-size="17" font-style="italic" fill="#16213e">t</text>
  <text id="lblHalf" x="266" y="316" text-anchor="middle" font-size="15" fill="#e63946">t₁/₂</text>
  <text id="lblTau" x="340" y="316" text-anchor="middle" font-size="16" fill="#16213e">τ</text>
  <text id="lblInsetT0" x="470" y="62" text-anchor="middle" font-size="14" fill="#16213e">t = 0</text>
  <text id="lblInsetTh" x="552" y="62" text-anchor="middle" font-size="14" fill="#16213e">t = t₁/₂</text>
  <text id="lblBadge" x="531" y="134" text-anchor="middle" font-size="13" fill="#e63946">A = λN  ⟹  A/N = ثابت</text>
  <text id="lblEq" x="320" y="336" text-anchor="middle" font-size="15" font-weight="bold" fill="#16213e">A(t) = λ·N(t) = A₀·e^(−λt) : نفس λ ونفس t₁/₂</text>
</svg>
