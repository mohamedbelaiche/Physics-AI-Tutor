<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <title>المتفاعل المحدّ</title>
  <desc>عمود A يختفي تمامًا (المتفاعل المحدّ) بينما يبقى جزء من B ، والتقدم الأعظمي x_max هو الأصغر بين المتفاعلين.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      svg * { animation: none !important; transition: none !important; }
    }
  </style>
  <rect x="6" y="6" width="628" height="348" rx="16" fill="#f4f8fc" stroke="#d5e4f2" stroke-width="2"/>

  <!-- قاعدة -->
  <line x1="100" y1="300" x2="540" y2="300" stroke="#16213e" stroke-width="3"/>

  <!-- عمود A المحدّ -->
  <text x="200" y="55" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a6db5">A — المتفاعل المحدّ</text>
  <g>
    <rect id="barA" x="130" y="90" width="140" height="210" rx="8" fill="#2a6db5">
      <animate attributeName="height" values="210;40;40" keyTimes="0;1;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="90;260;260" keyTimes="0;1;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#2a6db5;#2a6db5;#b7cbe3" keyTimes="0;0.35;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text id="lblA0" x="200" y="155" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">A</text>
    <text x="200" y="330" text-anchor="middle" font-size="14" fill="#16213e">x_max = n₀(A)/a</text>
  </g>

  <!-- عمود B الزائد -->
  <text x="440" y="55" text-anchor="middle" font-size="20" font-weight="bold" fill="#3f9d6e">B — زائد</text>
  <g>
    <rect id="barB" x="370" y="120" width="140" height="180" rx="8" fill="#3f9d6e">
      <animate attributeName="height" values="180;70;70" keyTimes="0;1;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;230;230" keyTimes="0;1;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text id="lblB0" x="440" y="175" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">B</text>
    <text x="440" y="330" text-anchor="middle" font-size="14" fill="#16213e">x_max = n₀(B)/b</text>
  </g>

  <text x="320" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="#e63946">✦</text>
  <text x="320" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#16213e">نحتفظ بالقيمة الأصغر لـ x_max ← تحدد المتفاعل المحدّ</text>
</svg>